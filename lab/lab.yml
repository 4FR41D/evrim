name: EVRIM Lab (7/24 kendi kendine öğrenme)

on:
  schedule:
    - cron: '17 */6 * * *'   # 6 saatte bir (00:17, 06:17, 12:17, 18:17 UTC)
  workflow_dispatch: {}

concurrency:
  group: evrim-lab
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lab döngüsü (bench + jüri + yeni quiz + öneri)
        run: node lab/run.mjs
      - name: Regresyon kapısı (tam test paketi)
        run: |
          npm install --no-audit --no-fund jsdom esbuild
          npx esbuild web/js/app.js --bundle --format=iife --outfile=tests/bundle.js
          node tests/suite.mjs
      - name: Sonuçları repoya işle
        run: |
          git config user.name "evrim-lab[bot]"
          git config user.email "4fr41d@users.noreply.github.com"
          git add -A   # oto-yama store.js/suite/sw/index dosyalarına da dokunabilir (data/settings.json gitignore'da)
          if git diff --cached --quiet; then echo "Değişiklik yok, commit atlandı."; exit 0; fi
          git commit -m "lab: $(date -u +%F-%H) — bench + yeni quiz + öneriler"
          for i in 1 2 3; do
            if git pull --rebase -X theirs origin main; then
              if git push origin HEAD:main; then
                git fetch -q origin main
                if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then echo "push DOĞRULANDI ✅"; exit 0; fi
              fi
            else
              git rebase --abort || true
            fi
            echo "deneme $i başarısız, 15 sn…"; sleep 15
          done
          echo "::error::lab sonuçları repoya işlenemedi (3 deneme)"; exit 1
